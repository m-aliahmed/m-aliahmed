<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Ali Ahmed, DevOps Engineer</title>
  <desc id="d">AWS Certified DevOps Engineer. I automate cloud infrastructure so teams ship faster, spend less, and recover quicker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .name { font-size: 54px; font-weight: 700; fill: #f0f6fc; }
    .role { font-size: 26px; font-weight: 600; fill: url(#accent); }
    .tag  { font-size: 21px; fill: #9da7b3; }
    .stage { font-size: 15px; font-weight: 600; fill: #c9d1d9; text-anchor: middle; letter-spacing: .5px; }
    .packet { animation: flow 6s linear infinite; }
    .packet.b { animation-delay: -2s; }
    .packet.c { animation-delay: -4s; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(400px); } }
    .node { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .packet, .node { animation: none; } }
  </style>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="60" y="62" width="6" height="176" rx="3" fill="url(#accent)"/>

  <text x="92" y="118" class="name">Muhammad Ali Ahmed</text>
  <text x="92" y="162" class="role">DevOps Engineer · AWS Certified Professional</text>
  <text x="92" y="204" class="tag">I automate cloud infrastructure so teams ship faster,</text>
  <text x="92" y="232" class="tag">spend less, and recover quicker.</text>

  <!-- CI/CD pipeline: Code → Build → Deploy → Monitor -->
  <g transform="translate(740 150)">
    <line x1="0" y1="0" x2="400" y2="0" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    <g fill="#ff9900">
      <circle class="packet" r="5" cx="0" cy="0"/>
      <circle class="packet b" r="5" cx="0" cy="0"/>
      <circle class="packet c" r="5" cx="0" cy="0"/>
    </g>
    <g fill="#161b22" stroke="#ff9900" stroke-width="3">
      <circle class="node" cx="0" cy="0" r="22"/>
      <circle class="node" cx="133" cy="0" r="22" style="animation-delay:-4.5s"/>
      <circle class="node" cx="267" cy="0" r="22" style="animation-delay:-3s"/>
      <circle class="node" cx="400" cy="0" r="22" style="animation-delay:-1.5s"/>
    </g>
    <g fill="none" stroke="#f0f6fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- code: </> -->
      <path d="M-6 -7 L-12 0 L-6 7 M6 -7 L12 0 L6 7 M2 -9 L-2 9"/>
      <!-- build: gear-ish box -->
      <rect x="124" y="-9" width="18" height="18" rx="3"/>
      <path d="M133 -9 V9 M124 0 H142"/>
      <!-- deploy: rocket arrow -->
      <path d="M259 8 L275 -8 M265 -8 H275 V2"/>
      <!-- monitor: pulse line -->
      <path d="M388 2 H393 L397 -8 L403 10 L407 2 H412"/>
    </g>
    <text class="stage" x="0" y="54">Code</text>
    <text class="stage" x="133" y="54">Build</text>
    <text class="stage" x="267" y="54">Deploy</text>
    <text class="stage" x="400" y="54">Monitor</text>
  </g>
</svg>
